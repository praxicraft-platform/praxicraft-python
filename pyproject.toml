[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxicraft"
version = "0.1.1"
description = "Official Python SDK for the Praxicraft Assess Public API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Praxicraft", email = "support@praxicraft.com" },
]
keywords = ["praxicraft", "assess", "hiring", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/praxicraft-platform/praxicraft-python"
Documentation = "https://docs.praxicraft.com"
Repository = "https://github.com/praxicraft-platform/praxicraft-python"
Issues = "https://github.com/praxicraft-platform/praxicraft-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/praxicraft"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
