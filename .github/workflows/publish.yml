name: Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Resolve version and decide whether to release
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          INIT_VERSION="$(python -c 'import re; from pathlib import Path; text=Path("src/praxicraft/__init__.py").read_text(); m=re.search(r"__version__\s*=\s*[\"\x27]([^\"\x27]+)", text); assert m, "__version__ missing"; print(m.group(1))')"
          if [ "$PKG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::pyproject.toml version ($PKG_VERSION) != __version__ ($INIT_VERSION)"
            exit 1
          fi
          TAG="v${PKG_VERSION}"
          {
            echo "version=$PKG_VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping publish (bump version in pyproject.toml for a new release)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $PKG_VERSION — will tag and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build distributions
        if: steps.version.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
